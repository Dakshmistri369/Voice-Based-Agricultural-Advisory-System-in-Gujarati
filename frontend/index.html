<!DOCTYPE html>
<html lang="gu" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>કિસાન સહાયક — Gujarati Agricultural Advisor</title>
  <meta name="description" content="Voice-based agricultural advisory system for Gujarat farmers. Ask in Gujarati about crops, schemes, mandi prices and weather." />

  <!-- Google Fonts: Noto Sans Gujarati + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">🌾</span>
      <div>
        <h1 class="brand-title">કિસાન સહાયક</h1>
        <p class="brand-sub">Gujarati Agricultural Advisor</p>
      </div>
    </div>
    <div class="header-status" id="api-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">Connecting…</span>
    </div>
  </div>
</header>

<!-- ── MAIN LAYOUT ─────────────────────────────────────── -->
<main class="app-main">

  <!-- Quick Action Tabs -->
  <nav class="quick-nav" role="tablist" aria-label="Quick actions">
    <button class="quick-tab active" data-query="આજે કપાસ ભાવ?" data-type="price" id="tab-price">
      <span class="tab-icon">💰</span>
      <span class="tab-label">ભાવ<br><small>Prices</small></span>
    </button>
    <button class="quick-tab" data-query="આજે વાતાવરણ કેવું છે?" data-type="weather" id="tab-weather">
      <span class="tab-icon">☔</span>
      <span class="tab-label">વાતાવ.<br><small>Weather</small></span>
    </button>
    <button class="quick-tab" data-query="PM-KISAN યોજનામાં કેટલી સહાય મળે?" data-type="scheme" id="tab-scheme">
      <span class="tab-icon">📋</span>
      <span class="tab-label">યોજના<br><small>Schemes</small></span>
    </button>
    <button class="quick-tab" data-query="કપાસ ની ખેતી માટે ખાતર કેટલું નાખવું?" data-type="crop" id="tab-crop">
      <span class="tab-icon">🌱</span>
      <span class="tab-label">ખેતી<br><small>Farming</small></span>
    </button>
  </nav>

  <!-- Chat Window -->
  <section class="chat-section">
    <div class="chat-window" id="chat-window" role="log" aria-live="polite" aria-label="Conversation">
      <!-- Welcome message injected by JS -->
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator hidden" id="typing-indicator" aria-hidden="true">
      <span></span><span></span><span></span>
      <small>ઉ. (thinking)…</small>
    </div>
  </section>

  <!-- Info Cards area (price / weather / scheme cards) -->
  <section class="cards-section" id="cards-section"></section>

  <!-- ── INPUT BAR ──────────────────────────────────── -->
  <div class="input-bar">

    <!-- Text input (fallback) -->
    <div class="text-input-wrap">
      <input
        type="text"
        id="text-input"
        class="text-input"
        placeholder="ગ. (type) ≡ ≡ ≡…  / Speak Gujarati 🎤"
        aria-label="Type your question in Gujarati or English"
        autocomplete="off"
      />
      <button class="send-btn" id="send-btn" aria-label="Send question">➤</button>
    </div>

    <!-- Mic button -->
    <button class="mic-btn" id="mic-btn" aria-label="Press to speak in Gujarati">
      <span class="mic-icon" id="mic-icon">🎤</span>
      <div class="mic-rings" id="mic-rings" aria-hidden="true">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
      </div>
    </button>

  </div>

  <!-- Recording status bar -->
  <div class="rec-status hidden" id="rec-status" role="status">
    <span class="rec-dot">●</span>
    <span id="rec-label">Recording… tap mic to stop (max 10s)</span>
  </div>

</main>

<!-- ── AUDIO PLAYER (hidden, auto-plays TTS response) ── -->
<audio id="tts-player" preload="auto" style="display:none"></audio>

<!-- ── DISTRICT SELECTOR (floating) ──────────────────── -->
<div class="district-pill" title="Select your district for accurate prices & weather">
  <label for="district-sel">📍</label>
  <select id="district-sel" aria-label="Your district">
    <option value="Rajkot">Rajkot</option>
    <option value="Ahmedabad">Ahmedabad</option>
    <option value="Junagadh">Junagadh</option>
    <option value="Amreli">Amreli</option>
    <option value="Bhavnagar">Bhavnagar</option>
    <option value="Surat">Surat</option>
    <option value="Vadodara">Vadodara</option>
    <option value="Mehsana">Mehsana</option>
    <option value="Patan">Patan</option>
    <option value="Banaskantha">Banaskantha</option>
  </select>
</div>

<script src="js/config.js"></script>
<script src="js/chat.js"></script>
<script src="js/voice.js"></script>
<script src="js/quickActions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
